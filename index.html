<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>vlsideepdive labs have moved</title>
<script>
// labs.vlsideepdive.com now lives at vlsideepdive.com. Keep the same path, query and hash,
// and carry this browser's saved lab progress (vdd-* keys) across once.
(function () {
  var T = "https://vlsideepdive.com";
  var rest = location.pathname + location.search + location.hash;
  try {
    if (!localStorage.getItem("vdd-moved-v1")) {
      var d = {}, n = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^vdd-/.test(k) && !/session/i.test(k)) { d[k] = localStorage.getItem(k); n++; }
      }
      if (n) {
        var s = JSON.stringify(d);
        if (s.length < 1500000) {
          localStorage.setItem("vdd-moved-v1", "1");
          location.replace(T + "/moved.html#to=" + encodeURIComponent(rest) + "&d=" + encodeURIComponent(s));
          return;
        }
      }
    }
  } catch (e) {}
  location.replace(T + rest);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://vlsideepdive.com/"></noscript>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:3rem 1rem;text-align:center;color:#222;background:#fff}a{color:#0a58ca}</style>
</head>
<body>
<p>vlsideepdive labs have moved to <a href="https://vlsideepdive.com/">vlsideepdive.com</a>.</p>
</body>
</html>
